ay:flex;gap:12px;align-items:center;background:transparent;color:#8a98ab;padding:12px;font-size:12px;text-align:left}.logout:hover{color:#d05b62}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 38px;gap:20px}.crumb{color:#8593a9;font-size:12px}.crumb span{color:#bcc6d4}.crumb b{font-weight:400;margin:0 11px;color:#d3dbe5}.top-actions{margin-left:auto;display:flex;align-items:center;gap:18px}.icon{display:grid;place-items:center;background:transparent;color:#71819a;padding:7px;border-radius:8px}.profile{display:flex;align-items:center;gap:9px;background:transparent}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#e7f0ff;color:#286bf0;font-size:10px;font-weight:700}.profile-copy{display:flex;flex-direction:column;text-align:left}.profile-copy b{font-size:11px;color:#354863}.profile-copy small{font-size:9px;color:#9aa8ba;margin-top:2px}.content{padding:39px 42px 24px;max-width:1500px;margin:auto}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px}.heading h1{font-size:29px;margin:7px 0}.soft,.filter{background:#fff;border:1px solid var(--line);color:#667894}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px #24457606}.card{padding:18px 17px;min-height:148px}.stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;margin-bottom:17px;background:#eaf2ff;color:#246bfd}.stat-label{color:#7b8ba2;font-size:11px}.stat-value{font:700 21px 'Space Grotesk';margin:7px 0}.stat-detail{color:#a4b0c0;font-size:9px}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:22px}.panel{padding:21px}.panel h2{font:600 15px 'Space Grotesk';margin:0;color:#213653}.panel-sub{color:#98a5b7;font-size:11px;margin:6px 0 0}.panel-head{display:flex;justify-content:space-between}.empty{min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#8391a5;text-align:center}.empty strong{color:#64758e;font-size:12px}.empty span{font-size:10px;color:#a4b0c0}.empty-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:#f3f7fc;color:#b0bfd2}.quick button{display:flex;align-items:center;gap:11px;width:100%;background:transparent;text-align:left;padding:13px 0;border-bottom:1px solid #eff3f8}.quick button:last-child{border:0}.quick-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:#eaf2ff;color:#246bfd}.quick b,.quick small{display:block}.quick b{font-size:11px;color:#52657f}.quick small{font-size:10px;color:#9aa8b9;margin-top:3px}.arrow{margin-left:auto;color:#9eb0c8;font-size:17px}.toolbar{display:flex;gap:9px;padding:17px 19px;border-bottom:1px solid var(--line)}.search{display:flex;align-items:center;gap:8px;flex:1;max-width:330px;border:1px solid var(--line);border-radius:9px;padding:0 11px;color:#a0aec0}.search input{border:0;outline:0;padding:9px 0;width:100%;font-size:11px}table{border-collapse:collapse;width:100%;min-width:730px}th{color:#9aa8ba;text-transform:uppercase;letter-spacing:.08em;font-size:9px;text-align:left;font-weight:700;padding:15px 19px;border-bottom:1px solid var(--line)}td{padding:0 19px}.table-scroll{overflow-x:auto}.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:700}.pending{background:#fff6df;color:#c28a1d}.approved,.active{background:#e5f8ef;color:#24966b}.rejected{background:#fff0ef;color:#cf686d}.profile-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}.profile-card{text-align:center;padding:31px}.avatar-lg{width:80px;height:80px;display:grid;place-items:center;margin:0 auto 17px;border-radius:50%;background:#e1edff;color:#246bfd;font:700 25px 'Space Grotesk';box-shadow:0 0 0 8px #f4f8ff}.profile-card h2{font:600 20px 'Space Grotesk';margin:6px 0 9px}.role{display:inline-block;background:#edf4ff;color:#286bf0;font-size:10px;font-weight:700;padding:6px 11px;border-radius:99px}.details{display:grid;grid-template-columns:1fr 1fr;gap:17px;text-align:left;border-top:1px solid var(--line);margin-top:27px;padding-top:22px}.details small,.details b{display:block}.details small{color:#9aa8ba;font-size:10px;margin-bottom:5px}.details b{color:#4e617c;font-size:11px;overflow-wrap:anywhere}.modal-backdrop{position:fixed;inset:0;background:#14274455;z-index:20;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:16px;padding:24px;width:min(450px,100%);box-shadow:0 25px 70px #173b7240}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font:600 18px 'Space Grotesk';margin:0}.close{background:transparent;color:#8796ab}.toast{position:fixed;right:20px;bottom:20px;background:#19345d;color:#fff;padding:12px 15px;border-radius:9px;font-size:12px;box-shadow:0 10px 30px #173b7240;z-index:30}.menu{display:none;background:transparent;color:#607492}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.content{padding:32px 25px}}@media(max-width:720px){.side{position:fixed;left:-270px;top:0;bottom:0;width:260px;transition:left .22s;box-shadow:12px 0 30px #173b7220}.side.open{left:0}.menu{display:grid;place-items:center}.top{height:62px;padding:0 16px;gap:11px}.profile-copy,.profile>span:last-child{display:none}.content{padding:27px 15px 20px}.heading{align-items:flex-start;gap:17px;flex-direction:column;margin-bottom:23px}.heading h1{font-size:26px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px;min-height:135px}.grid,.profile-grid{grid-template-columns:1fr;gap:13px}.panel{padding:17px}.login-panel{padding:32px 25px 26px}.login-copy{margin-top:52px}.toolbar{padding:12px;flex-wrap:wrap}.search{max-width:none;flex-basis:100%}}

<body><div id="root"></div><div id="toast" class="toast hidden"></div><div id="modal" class="modal-backdrop hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyDrmZo37Pb2vmzwb8gHR6ovhyKAekjs2zg',authDomain:'buyrefy.firebaseapp.com',projectId:'buyrefy',storageBucket:'buyrefy.firebasestorage.app',messagingSenderId:'495329695513',appId:'1:495329695513:web:23942c0b3ff8763f9ad788',measurementId:'G-PWGH7R96XE'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let admin=null,profile=null,current='Dashboard';
const icons={Dashboard:'⌂',Users:'◉',Wallets:'▣','Verification Requests':'✓',Transactions:'▤',Commissions:'₦',Withdrawals:'↓',Platforms:'◈','Admin Logs':'≡',Settings:'⚙','My Profile':'◎'};const pages={Users:['OPERATIONS / USERS','Users','Manage agent accounts, access and wallet visibility.',['Name','Email','Phone','Role','Wallet balance','Status','Joined']],Wallets:['OPERATIONS / WALLETS','Wallet management','Review balances and make controlled, audited adjustments.',['User','Current balance','Total deposited','Last updated','Status']], 'Verification Requests':['OPERATIONS / VERIFICATIONS','Verification requests','Review submitted investor verification requests.',['Verification ID','Agent','Investor','Platform','Amount','Status']],Transactions:['OPERATIONS / LEDGER','Transactions','A complete, immutable history of wallet and verification activity.',['Transaction ID','User','Type','Amount','Status','Date']],Commissions:['OPERATIONS / COMMISSIONS','Commissions','Track eligible commissions and payout status.',['Agent','Verification ID','Platform','Commission','Status','Date']],Withdrawals:['OPERATIONS / WITHDRAWALS','Withdrawal requests','Process manual withdrawal requests with clear accountability.',['Agent','Amount','Bank','Account name','Request date','Status']],Platforms:['SYSTEM / PLATFORMS','Platforms','Manage the investment platforms available for verification.',['Platform name','Status','Created','Last updated','Actions']], 'Admin Logs':['SYSTEM / AUDIT TRAIL','Admin activity log','Every important administrative action, recorded for accountability.',['Admin','Action','Target','Date','Details']],Settings:['SYSTEM / SETTINGS','Settings','Configure approval policies and console preferences.',[]],'My Profile':['ACCOUNT / PROFILE','My profile','Your administrator identity and access details.',[]]};
const root=document.getElementById('root');function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3200)}function initials(n){return (n||'Admin').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'AD'}function money(n){return new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n)||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function loginView(){root.innerHTML=`<div class="login-page"><div class="orb one"></div><div class="orb two"></div><div class="login-panel"><div class="brand"><div class="mark">↗</div><div><strong>BUYREFY</strong><small>ADMIN CONSOLE</small></div></div><div class="login-copy"><span class="eyebrow">SECURE ADMIN ACCESS</span><h1>Welcome Back</h1><p>Sign in to BUYREFY Admin</p></div><form id="login" class="form"><label>Email address<input id="email" type="email" placeholder="admin@buyrefy.com" required></label><label>Password<div class="input-wrap"><input id="password" type="password" placeholder="Enter your password" required><button type="button" class="input-action" id="show">Show</button></div></label><div id="login-error" class="error hidden"></div><button class="primary full" id="signin">Sign in to console <span>→</span></button><button type="button" class="forgot" id="reset">Forgot password?</button></form><div class="login-foot">⌑ Protected by Firebase Authentication</div></div></div>`;document.getElementById('show').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';document.getElementById('show').textContent=p.type==='password'?'Show':'Hide'};document.getElementById('reset').onclick=async()=>{const e=document.getElementById('email').value.trim();if(!e)return showLoginError('Enter your email address first.');try{await auth.sendPasswordResetEmail(e);toast('Password reset email sent successfully.')}catch(x){showLoginError('Unable to send reset email. Check the address and try again.')}};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('signin');b.disabled=true;b.textContent='Signing in…';try{const c=await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);const s=await db.collection('users').doc(c.user.uid).get();if(!s.exists||s.data().role!=='admin'||s.data().status!=='active'){await auth.signOut();throw Error('Access Denied — this account is not an authorized administrator.')}admin=c.user;profile=s.data();render()}catch(x){showLoginError(x.message.startsWith('Access Denied')?x.message:'The email or password is incorrect.')}finally{b.disabled=false;b.innerHTML='Sign in to console <span>→</span>'}}}function showLoginError(m){const e=document.getElementById('login-error');e.textContent=m;e.classList.remove('hidden')}
async function stats(){const [u,w,v,t,c]=await Promise.all(['users','wallets','verificationRequests','transactions','commissions'].map(x=>db.collection(x).get().catch(()=>({docs:[],size:0}))));return{users:u.size||u.docs.length,wallet:(w.docs||[]).reduce((a,x)=>a+(Number(x.data().balance)||0),0),pending:(v.docs||[]).filter(x=>x.data().status==='pending').length,completed:(v.docs||[]).filter(x=>x.data().status==='approved'||x.data().status==='completed').length,transactions:t.size||t.docs.length,commissions:(c.docs||[]).reduce((a,x)=>a+(Number(x.data().amount)||0),0)}}
async function dashboard(){let s={users:0,wallet:0,pending:0,completed:0,transactions:0,commissions:0};try{s=await stats()}catch{}return `<div class="heading"><div><span class="eyebrow">OVERVIEW</span><h1>Welcome back, ${esc(profile.fullName||'Admin')}</h1><p>Here’s what’s happening across your verification network.</p></div><button class="soft" onclick="dashboardRefresh()">↻ Refresh</button></div><div class="stats"><div class="card"><div class="stat-icon">◉</div><div class="stat-label">Total users</div><div class="stat-value">${s.users}</div><div class="stat-detail">Registered agents & users</div></div><div class="card"><div class="stat-icon">▣</div><div class="stat-label">Total wallet balance</div><div class="stat-value">${money(s.wallet)}</div><div class="stat-detail">Across all user wallets</div></div><div class="card"><div class="stat-icon">✓</div><div class="stat-label">Pending verifications</div><div class="stat-value">${s.pending}</div><div class="stat-detail">Awaiting your review</div></div><div class="card"><div class="stat-icon">✓</div><div class="stat-label">Completed verifications</div><div class="stat-value">${s.completed}</div><div class="stat-detail">Successfully completed</div></div><div class="card"><div class="stat-icon">▤</div><div class="stat-label">Total transactions</div><div class="stat-value">${s.transactions}</div><div class="stat-detail">Recorded transactions</div></div><div class="card"><div class="stat-icon">₦</div><div class="stat-label">Total commissions</div><div class="stat-value">${money(s.commissions)}</div><div class="stat-detail">Commission recorded</div></div></div><div class="grid"><div class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p class="panel-sub">Latest events from your admin team</p></div></div><div class="empty"><div class="empty-icon">≡</div><strong>No activity yet</strong><span>Data will appear here once it has been added to Firebase.</span></div></div><div class="panel quick"><div class="panel-head"><div><h2>Quick actions</h2><p class="panel-sub">Common admin tasks</p></div></div><button onclick="navigate('Wallets')"><span class="quick-icon">▣</span><span><b>Add wallet funds</b><small>Credit an agent wallet</small></span><span class="arrow">→</span></button><button onclick="navigate('Verification Requests')"><span class="quick-icon">✓</span><span><b>Review verifications</b><small>Check pending requests</small></span><span class="arrow">→</span></button><button onclick="navigate('Users')"><span class="quick-icon">◉</span><span><b>Manage users</b><small>View and update accounts</small></span><span class="arrow">→</span></button></div></div>`}
async function pageView(page){if(page==='My Profile')return `<div class="heading"><div><span class="eyebrow">${pages[page][0]}</span><h1>${pages[page][1]}</h1><p>${pages[page][2]}</p></div></div><div class="profile-grid"><div class="panel profile-card"><div class="avatar-lg">${initials(profile.fullName)}</div><h2>${esc(profile.fullName||'Admin')}</h2><span class="role">Administrator</span><div class="details"><div><small>Full name</small><b>${esc(profile.fullName||'Admin')}</b></div><div><small>Email</small><b>${esc(admin.email)}</b></div><div><small>Role</small><b>Administrator</b></div><div><small>Status</small><b class="active">● Active</b></div></div></div><div class="panel"><div class="stat-icon">✓</div><h2>Protected administrator account</h2><p class="panel-sub">Your access is verified against Firebase Authentication and the <b>users</b> collection on every session.</p></div></div>`;const c=pages[page];return `<div class="heading"><div><span class="eyebrow">${c[0]}</span><h1>${c[1]}</h1><p>${c[2]}</p></div>${['Wallets','Platforms'].includes(page)?`<button class="primary" onclick="${page==='Wallets'?'openWallet()':'toast(\'Platform forms write to the platforms collection.\')'}">＋ ${page==='Wallets'?'Add funds':'Add platform'}</button>`:''}</div><div class="panel" style="padding:0"><div class="toolbar"><div class="search">⌕<input placeholder="Search ${page.toLowerCase()}…"></div><button class="filter">☷ Filters</button></div>${c[3].length?`<div class="table-scroll"><table><thead><tr>${c[3].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody><tr><td colspan="${c[3].length}"><div class="empty"><div class="empty-icon">${icons[page]}</div><strong>No ${page.toLowerCase()} found</strong><span>Data will appear here once it has been added to Firebase.</span></div></td></tr></tbody></table></div>`:''}</div>`}
async function render(){if(!admin)return loginView();root.innerHTML=`<div class="app"><aside class="side" id="side"><div class="side-top"><div class="brand"><div class="mark">↗</div><div><strong>BUYREFY</strong><small>ADMIN CONSOLE</small></div></div></div><div class="workspace"><i></i> Production workspace <span>⌄</span></div><nav class="nav">${Object.keys(icons).map((x,i)=>`${i===1?'<div class="nav-label">OPERATIONS</div>':''}${i===7?'<div class="nav-label">SYSTEM</div>':''}${i===10?'<div class="nav-label">ACCOUNT</div>':''}<button class="${current===x?'active':''}" onclick="navigate('${x}')"><span>${icons[x]}</span>${x}<b>${x==='Verification Requests'?'0':''}</b></button>`).join('')}</nav><div class="side-foot"><div class="secure">✓ <span><b>Secure console</b><small>Firebase protected</small></span></div><button class="logout" onclick="auth.signOut()">↪ Log out</button></div></aside><main class="main"><header class="top"><button class="menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="crumb"><span>BUYREFY</span><b>/</b>${current}</div><div class="top-actions"><button class="icon">♧</button><button class="profile" onclick="navigate('My Profile')"><span class="avatar">${initials(profile.fullName)}</span><span class="profile-copy"><b>${esc(profile.fullName||'Admin')}</b><small>Administrator</small></span></button></div></header><section class="content" id="content"><div class="empty">Loading…</div></section></main></div>`;document.getElementById('content').innerHTML=current==='Dashboard'?await dashboard():await pageView(current)}async function navigate(x){current=x;await render()}async function dashboardRefresh(){await render();toast('Dashboard refreshed')}function openWallet(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modal-head"><h2>Add wallet funds</h2><button class="close" onclick="closeModal()">✕</button></div><p class="panel-sub">This creates an audited wallet credit and transaction record.</p><form class="form" id="wallet-form"><label>User ID<input id="wallet-user" required placeholder="Firebase user ID"></label><label>Amount (₦)<input id="wallet-amount" type="number" min="0.01" step="0.01" required></label><label>Reference / note<textarea id="wallet-note" required placeholder="Payment reference"></textarea></label><button class="primary full">Credit wallet</button></form></div>`;document.getElementById('modal').classList.remove('hidden');document.getElementById('wallet-form').onsubmit=async e=>{e.preventDefault();const uid=document.getElementById('wallet-user').value.trim(),amount=Number(document.getElementById('wallet-amount').value),note=document.getElementById('wallet-note').value.trim();if(amount<=0)return toast('Enter a valid positive amount.');try{await db.runTransaction(async tx=>{const w=db.collection('wallets').doc(uid),snap=await tx.get(w),old=snap.exists?Number(snap.data().balance)||0:0;tx.set(w,{balance:old+amount,totalDeposited:(Number(snap.data()?.totalDeposited)||0)+amount,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});const t=db.collection('transactions').doc();tx.set(t,{userId:uid,type:'wallet_credit',amount,description:note,status:'completed',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:admin.uid,reference:note});const l=db.collection('adminLogs').doc();tx.set(l,{adminId:admin.uid,action:'wallet_credit',targetUserId:uid,amount,description:note,createdAt:firebase.firestore.FieldValue.serverTimestamp()})});closeModal();toast('Wallet funded successfully.');await render()}catch(x){toast('Unable to complete this action. Check admin permissions.')}}}function closeModal(){document.getElementById('modal').classList.add('hidden')}auth.onAuthStateChanged(async u=>{if(!u){admin=null;profile=null;loginView();return}try{const s=await db.collection('users').doc(u.uid).get();if(!s.exists||s.data().role!=='admin'||s.data().status!=='active'){await auth.signOut();return}admin=u;profile=s.data();render()}catch{await auth.signOut()}});
</script></body></html>
